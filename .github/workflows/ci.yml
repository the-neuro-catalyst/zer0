name: "ZERO Enterprise CI Pipeline"

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

env:
  RUST_VERSION: "1.85.0"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-flight checks
  pre-checks:
    name: "Pre-flight Checks"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Validate commit messages"
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ".commitlintrc.json"

      - name: "Check for merge conflicts"
        run: |
          if grep -r "^<<<<<<< HEAD" .; then
            echo "Merge conflict markers found!"
            exit 1
          fi

  # Rust code quality
  rust-quality:
    name: "Rust Code Quality"
    runs-on: ubuntu-22.04
    needs: pre-checks
    steps:
      - uses: actions/checkout@v6

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"

      - name: "Format check"
        run: cargo fmt --all -- --check

      - name: "Clippy linting"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: "Check documentation"
        run: cargo doc --no-deps --document-private-items

  # Rust tests
  rust-tests:
    name: "Rust Tests (${{ matrix.test-type }})"
    runs-on: ${{ matrix.os }}
    needs: rust-quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        test-type: [unit, integration, doc]
        exclude:
          # Doc tests only on Linux
          - os: macos-latest
            test-type: doc
          - os: windows-latest
            test-type: doc
    steps:
      - uses: actions/checkout@v6

      - name: "Install system dependencies (Linux)"
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: ${{ matrix.os }}-${{ matrix.test-type }}

      - name: "Setup test data"
        run: bash scripts/setup_test_data.sh

      - name: "Run unit tests"
        if: matrix.test-type == 'unit'
        run: cargo test --lib --workspace --verbose

      - name: "Run integration tests"
        if: matrix.test-type == 'integration'
        run: cargo test --test '*' --workspace --verbose

      - name: "Run doc tests"
        if: matrix.test-type == 'doc'
        run: cargo test --doc --workspace --verbose

      - name: "Run benchmarks (sanity check)"
        if: matrix.os == 'ubuntu-22.04'
        run: cargo bench --no-run

  # Code coverage
  coverage:
    name: "Code Coverage"
    runs-on: ubuntu-22.04
    needs: rust-tests
    steps:
      - uses: actions/checkout@v6

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libglib2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev lcov

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2

      - name: "Setup test data"
        run: bash scripts/setup_test_data.sh

      - name: "Install tarpaulin"
        run: cargo install cargo-tarpaulin

      - name: "Generate coverage"
        run: |
          cargo tarpaulin \
            --workspace \
            --out Xml \
            --timeout 300 \
            --exclude-files tests/* \
            --fail-under 60

      - name: "Upload to Codecov"
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          flags: rust-coverage
          fail_ci_if_error: false

  # TypeScript/Frontend tests
  frontend-quality:
    name: "Frontend Quality"
    runs-on: ubuntu-22.04
    needs: pre-checks
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Cache Node modules"
        uses: actions/cache@v5
        with:
          path: crates/ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('crates/ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: "Install dependencies"
        working-directory: crates/ui
        run: pnpm install --frozen-lockfile

      - name: "TypeScript type check"
        working-directory: crates/ui
        run: pnpm tsc --noEmit

      - name: "ESLint"
        working-directory: crates/ui
        run: pnpm lint

      - name: "Test frontend"
        working-directory: crates/ui
        run: pnpm test --coverage || true

      - name: "Build Tauri info"
        working-directory: crates/ui
        run: pnpm tauri info

  # Tauri build validation
  tauri-build:
    name: "Tauri Build Validation"
    runs-on: ${{ matrix.os }}
    needs: frontend-quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: "Install system dependencies (Linux)"
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Cache Node modules"
        uses: actions/cache@v5
        with:
          path: crates/ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('crates/ui/pnpm-lock.yaml') }}

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/ui/src-tauri -> target"

      - name: "Install dependencies"
        working-directory: crates/ui
        run: pnpm install --frozen-lockfile

      - name: "Build Tauri app"
        working-directory: crates/ui
        run: pnpm tauri build

  # Performance benchmarks
  benchmarks:
    name: "Performance Benchmarks"
    runs-on: ubuntu-22.04
    needs: rust-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: "Install system dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libglib2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2

      - name: "Generate benchmark data"
        run: python3 scripts/generate_benchmark_data.py

      - name: "Run benchmarks"
        run: cargo bench --workspace --no-fail-fast 2>&1 | tee benchmark-results.txt

      - name: "Store benchmark results"
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: "cargo"
          output-file-path: benchmark-results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

  # Final status check
  ci-status:
    name: "CI Status Check"
    runs-on: ubuntu-22.04
    needs: [rust-quality, rust-tests, coverage, frontend-quality, tauri-build]
    if: always()
    steps:
      - name: "Check CI status"
        run: |
          if [[ "${{ needs.rust-quality.result }}" == "failure" || \
                "${{ needs.rust-tests.result }}" == "failure" || \
                "${{ needs.coverage.result }}" == "failure" || \
                "${{ needs.frontend-quality.result }}" == "failure" || \
                "${{ needs.tauri-build.result }}" == "failure" ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          else
            echo "✅ CI Pipeline Passed"
          fi

      - name: "Notify Slack on success"
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: "✅ ZERO CI pipeline passed"
        env:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
