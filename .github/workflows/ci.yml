name: ZERO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-integrity-check:
    name: Rust Integrity Check 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache Setup
        uses: swatinem/rust-cache@v2

      - name: Rust Integrity (Check & Lint)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace -- -D warnings
          
      - name: UI Tauri Build
        run: |
          cd crates/ui
          pnpm tauri info
          pnpm tauri build

      - name: Rust Cache Integrity
        uses: swatinem/rust-cache@v2
        
      - name: Logic Validation (Test)
        run: |
          scripts/setup_test_data.sh
          cargo test --workspace

      - name: Rust Cache Logic Validation
        uses: swatinem/rust-cache@v2

  ui-integrity-check:
      name: UI Integrity (TypeScript)
      runs-on: ubuntu-latest

      steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: UI Install & Typecheck  
        run: |
          cd crates/ui
          pnpm install --frozen-lockfile
          pnpm tsc

      - name: Cache UI Packages
        uses: actions/cache@v3
        with: 
          path: crates/ui/node_modules
          key: ui-${{ runner.os }}-pnpm-${{ hashFiles('crates/ui/pnpm-lock.yaml') }}
          restore-keys: |
            ui-${{ runner.os }}-pnpm-${{ hashFiles('crates/ui/pnpm-lock.yaml') }}
# End of file          