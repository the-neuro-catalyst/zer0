name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Systemic Validation (Test Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust (2024 Edition)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache Cargo Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Protocol Format Check
        run: cargo fmt --all -- --check
      
      - name: Static Analysis (Clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      
      - name: Build Intelligence Layer
        run: cargo build --workspace --release
      
      - name: Execute Full Alignment Test
        run: cargo test --workspace --release
      
      - name: Benchmarking Check
        run: cargo bench --workspace --no-run

  security-audit:
    name: Security & Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run Security Audit
        run: cargo audit

  build-artifacts:
    name: Build Multi-Platform Binaries
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build Unified Gateway (sfi-cli)
        run: cargo build --release --bin sfi-cli
      
      - name: Upload System Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: sfi-cli-stack-${{ matrix.os }}
          path: |
            target/release/sfi-cli
            target/release/sfi-cli.exe
        continue-on-error: true
