name: "Enterprise Release Pipeline"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      create_release_notes:
        description: "Generate automated release notes"
        required: false
        default: true
        type: boolean
      run_security_scan:
        description: "Run security audit"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - release
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/release.yml"

env:
  RUST_VERSION: "1.85.0"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # Pre-release validations
  validate:
    name: "Validation & Security Checks"
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Validate branch protection"
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/release" ]]; then
            echo "✓ Release branch validation passed"
          else
            echo "✗ Releases must originate from 'release' branch"
            exit 1
          fi

      - name: "Extract version from Cargo.toml"
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: "Generate changelog"
        id: changelog
        run: |
          # Install git-cliff for automated changelog
          cargo install git-cliff
          git-cliff --output RELEASE_NOTES.md
          CHANGELOG=$(cat RELEASE_NOTES.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "Lint Rust code"
        run: |
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings

      - name: "Check formatting"
        run: |
          rustup component add rustfmt
          cargo fmt -- --check

      - name: "Run cargo audit (Security)"
        if: inputs.run_security_scan != false
        run: |
          cargo install cargo-audit
          cargo audit --deny warnings

      - name: "Check dependencies for vulnerabilities"
        run: |
          cargo install cargo-deny
          cargo deny check

  # Run comprehensive tests
  test:
    name: "Tests & Coverage"
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: "Install system dependencies (Linux)"
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev lcov

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: ${{ matrix.target }}

      - name: "Cache Node modules"
        uses: actions/cache@v5
        with:
          path: crates/ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('crates/ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: "Run unit tests"
        run: |
          cargo test --all --lib --verbose
          echo "✓ Unit tests passed"

      - name: "Run integration tests"
        run: |
          cargo test --all --test '*' --verbose
          echo "✓ Integration tests passed"

      - name: "Build documentation tests"
        run: |
          cargo test --all --doc --verbose
          echo "✓ Documentation tests passed"

      - name: "Generate coverage report (Linux only)"
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --all --out Xml --timeout 300

      - name: "Upload coverage to Codecov"
        if: matrix.os == 'ubuntu-22.04'
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # Build all artifacts
  build:
    name: "Build Artifacts"
    runs-on: ${{ matrix.platform }}
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            artifact_prefix: "linux-gnu"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            artifact_prefix: "macos-arm64"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            artifact_prefix: "macos-x86_64"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            artifact_prefix: "windows-x86_64"
    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: "Install system dependencies (Linux)"
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates -> target"
          key: release-${{ matrix.target }}

      - name: "Cache Node modules"
        uses: actions/cache@v5
        with:
          path: crates/ui/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('crates/ui/pnpm-lock.yaml') }}

      - name: "Install build tools"
        run: |
          cargo install cargo-deb
          cargo install cargo-bundle
          cargo install cargo-wix

      - name: "Build Rust release binaries"
        run: |
          cargo build --release \
            --target ${{ matrix.target }} \
            --bin zero-cli \
            --bin zero-tui \
            --bin zero-server

      - name: "Build frontend assets"
        run: |
          cd crates/ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: "Package CLI (Linux - deb)"
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p artifacts
          cargo deb -p cli --target ${{ matrix.target }} --no-build
          mv target/${{ matrix.target }}/debian/*.deb artifacts/zero-cli-${{ matrix.artifact_prefix }}.deb

      - name: "Package TUI (Linux - deb)"
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo deb -p tui --target ${{ matrix.target }} --no-build
          mv target/${{ matrix.target }}/debian/*.deb artifacts/zero-tui-${{ matrix.artifact_prefix }}.deb

      - name: "Package CLI (macOS - binary)"
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/zero-cli artifacts/zero-cli-${{ matrix.artifact_prefix }}
          chmod +x artifacts/zero-cli-${{ matrix.artifact_prefix }}

      - name: "Package TUI (macOS - DMG)"
        if: matrix.platform == 'macos-latest'
        run: |
          cargo bundle -p tui --release --target ${{ matrix.target }}
          mkdir -p artifacts
          hdiutil create -volname "Zero TUI" \
            -srcfolder target/${{ matrix.target }}/release/bundle/osx \
            -ov -format UDZO \
            artifacts/zero-tui-${{ matrix.artifact_prefix }}.dmg

      - name: "Package CLI (Windows - exe)"
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p artifacts
          copy target\${{ matrix.target }}\release\zero-cli.exe artifacts\zero-cli-${{ matrix.artifact_prefix }}.exe
          copy target\${{ matrix.target }}\release\zero-tui.exe artifacts\zero-tui-${{ matrix.artifact_prefix }}.exe

      - name: "Package CLI (Windows - MSI)"
        if: matrix.platform == 'windows-latest'
        run: |
          cargo wix -p cli --target ${{ matrix.target }} -o artifacts/

      - name: "Create checksums"
        run: |
          cd artifacts
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done

      - name: "Sign binaries (Windows)"
        if: matrix.platform == 'windows-latest' && github.event_name == 'push'
        env:
          SIGNING_KEY: ${{ secrets.WINDOWS_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if [ ! -z "$SIGNING_KEY" ]; then
            echo "Note: Code signing would be performed here"
          fi

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_prefix }}-artifacts
          path: artifacts/
          retention-days: 7

  # Build Tauri App
  build-tauri:
    name: "Build Tauri Application"
    runs-on: ${{ matrix.platform }}
    needs: [validate, test]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Install system dependencies (Linux)"
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libssl-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Setup pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: "Cache Rust artifacts"
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/ui/src-tauri -> target"

      - name: "Install frontend dependencies"
        run: |
          cd crates/ui
          pnpm install --frozen-lockfile

      - name: "Build with Tauri"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "crates/ui"
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: ${{ needs.validate.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Create GitHub Release
  release:
    name: "Create Release"
    runs-on: ubuntu-22.04
    needs: [validate, build, build-tauri]
    if: github.event_name == 'push' || github.event.inputs.create_release_notes == 'true'
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Download all artifacts"
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: "Prepare release assets"
        run: |
          mkdir -p final-release
          find release-artifacts -type f -name "*.sha256" -o -name "*.exe" \
            -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \
            | xargs -I {} cp {} final-release/ 2>/dev/null || true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: final-release/*
          body: ${{ needs.validate.outputs.changelog }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          tag_name: v${{ needs.validate.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to registries
  publish:
    name: "Publish Artifacts"
    runs-on: ubuntu-22.04
    needs: [validate, release]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Publish to crates.io"
        run: |
          cargo publish \
            --token ${{ secrets.CARGO_REGISTRY_TOKEN }} \
            -p schema || true
          cargo publish \
            --token ${{ secrets.CARGO_REGISTRY_TOKEN }} \
            -p config || true
          cargo publish \
            --token ${{ secrets.CARGO_REGISTRY_TOKEN }} \
            -p reader || true

      - name: "Setup Node.js for npm publish"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: "Publish frontend to npm"
        working-directory: crates/ui
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Post-release validations
  verify:
    name: "Verify Release"
    runs-on: ubuntu-22.04
    needs: [validate, publish]
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: "Verify GitHub Release"
        run: |
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ needs.validate.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "$RELEASE_URL")
          if [ "$STATUS" -eq 200 ]; then
            echo "✓ Release published successfully"
          else
            echo "✗ Release verification failed (HTTP $STATUS)"
            exit 1
          fi

      - name: "Send Slack notification"
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Release Pipeline: ${{ job.status }}
            Version: v${{ needs.validate.outputs.version }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author

      - name: "Create deployment"
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'v${{ needs.validate.outputs.version }}',
              environment: 'production',
              description: 'Production release',
              auto_merge: false,
              required_contexts: []
            });
