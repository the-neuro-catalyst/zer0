name: "publish"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file libssl-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "crates/ui/src-tauri -> target"

      - name: install frontend dependencies
        run: |
          cd crates/ui
          pnpm install --frozen-lockfile

      - name: Install Packaging Tools
        run: |
          cargo install cargo-deb
          cargo install cargo-bundle

      - name: Build CLI & TUI Packages (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo build --release --bin zero-cli --bin zero-tui
          cargo deb -p cli --no-build
          cargo deb -p tui --no-build
          mkdir -p artifacts
          cp target/debian/*.deb artifacts/

      - name: Build CLI & TUI Packages (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release --bin zero-cli --bin zero-tui
          cargo bundle -p tui --release
          mkdir -p artifacts
          # macOS bundles are directories, we usually zip them or create DMG
          tar -czf artifacts/zero-tui-macos.tar.gz -C target/release/bundle/osx "ZERO TUI.app"
          cp target/release/zero-cli artifacts/zero-cli-macos

      - name: Build CLI & TUI Packages (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cargo build --release --bin zero-cli --bin zero-tui
          mkdir -p artifacts
          cp target/release/zero-cli.exe artifacts/zero-cli-windows.exe
          cp target/release/zero-tui.exe artifacts/zero-tui-windows.exe

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "crates/ui"
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "Systemic Release v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload CLI/TUI Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
