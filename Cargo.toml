[workspace.package]
version = "0.1.0"
authors = ["The Neuro-Catalyst Group"]
edition = "2021"                                                                                         # Changed back to 2024
license = "LICENSE"
repository = "https://github.com/the-neuro-catalyst/zer0"
rust-version = "1.85"
readme = "README.md"
categories = ["command-line-utilities", "development-tools", "data-structures"]
description = "Universal Data Inspector - Local-first, high-performance zero-copy data analysis engine."
documentation = "https://github.com/the-neuro-catalyst/zer0"
exclude = ["test_data/*", "target/*"]
license-file = "LICENSE"
homepage = "https://github.com/the-neuro-catalyst/zer0"
include = ["crates/**/*", "Cargo.toml", "LICENSE", "README.md"]
keywords = ["data", "inspector", "parquet", "zero-copy", "analysis"]
publish = false

[profile.dev]
opt-level = 0
debug = 1          # Line tables only (saves space/time vs full debug)
incremental = true

[profile.dev.package.funty]
opt-level = 0 # Workaround for compiler panic (ICE)

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2 # High speed, but safer for compiler stack than level 3

# Optimize build-dependencies (proc-macros)
[profile.dev.build-override]
opt-level = 0

[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Maximize optimization at the cost of compile time
panic = "abort"   # Remove panic unwinding to save size
strip = true      # Strip symbols from binary automatisch (Rust 1.59+)

[workspace]
members = [
    "crates/cli",
    "crates/config",
    "crates/ingestor",
    "crates/reader",
    "crates/schema",
    "crates/tui",
    "crates/ui/src-tauri",
]
exclude = ["crates/ui/src-tauri"]
resolver = "2"

[workspace.dependencies]
# Testing
assert_approx_eq = "1.1"
mockito = "1.2"
os_pipe = "1.0"
assert_cmd = "2.0"
criterion = { version = "0.8.1", features = ["html_reports", "async_tokio"] }

# Async Runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Error Handling (The Holy Duo)
anyhow = "1.0"
thiserror = "2.0.18"
time = { version = "0.3.34", features = ["macros"] }

# Interface & Data
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics & Telemetry
metrics = "0.24.3"

# Configuration Management
config = "0.15.19"

# Data Processing
csv = "1.3"
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
parquet = "57"
arrow = "57"
arrow-csv = "57"
arrow-flight = "57"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1.19", features = ["v4"] }
rand = "0.9"
rand_distr = "0.5"
rayon = "1.11.0"
walkdir = "2"
dirs = "6.0.0"

dotenv = { version = "0.15", package = "dotenvy" }
console = { version = "0.16", features = ["std"] }
async-trait = "0.1"
reqwest = { version = "0.13.1", features = ["json"] }
toml = "*"
log = "0.4"
env_logger = "0.11"

# ZERO Dependencies
# Database & Cloud
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.24.0-dev.0"
dotenvy = "0.15"
aws-config = "1.8.12"
aws-sdk-s3 = "1.120.0"
mysql_async = "0.36.1"
object_store = "0.13.1"
mongodb = "3.5.0"
neo4rs = "0.8.0"
qdrant-client = "1.16"
deadpool-postgres = "0.14.1"

# Streaming & Messaging
rdkafka = "0.39.0"
lapin = "3.7.2"
futures-util = "0.3.31"
async-stream = "0.3"
tokio-stream = "0.1"

# Text Processing
chardetng = "0.1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
pulldown-cmark = "0.9"
url = "2.5"

# Observability
tracing-appender = "0.2"
opentelemetry = "0.21"
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"] }
opentelemetry-otlp = "0.14"
tracing-opentelemetry = "0.22"

# Retry & Backoff
backoff = "0.4"

# Additional
bytes = "1.9"
num_cpus = "1.17"
hyperloglogplus = "0.4.1"
memmap2 = "0.9"
calamine = "0.32"
serde_yml = "0.0.12"
zip = "0.6"
flate2 = "1.0"
image = "0.25"
kamadak-exif = "0.5"
pdf-extract = "0.10"
quick-xml = { version = "0.38", features = ["serde"] }
chrono-tz = "0.8"
yoke-derive = "0.8.1"
zerovec = "*"
# TUI & Monitoring
ratatui = { version = "0.26" }
crossterm = { version = "0.27", features = ["events", "serde"] }

http = "1.0.0"

tempfile = "3.23"

hyper-util = { package = "hyper-util", version = "=0.1.18" }

